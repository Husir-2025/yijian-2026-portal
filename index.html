<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026阅卷招募填报系统</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Noto+Serif+SC:wght@600;700;900&display=swap">
<style>
  :root{
    --bg-0:#071733;
    --bg-1:#0c2650;
    --bg-2:#10336b;
    --blue:#3b82f6;
    --blue-deep:#2563eb;
    --blue-light:#60a5fa;
    --ink:#f4f8ff;
    --ink-soft:#aec4e6;
    --line:rgba(255,255,255,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(1100px 700px at 78% -10%, rgba(59,130,246,.38), transparent 60%),
      radial-gradient(900px 600px at 12% 110%, rgba(37,99,235,.34), transparent 60%),
      linear-gradient(160deg,var(--bg-2) 0%,var(--bg-1) 42%,var(--bg-0) 100%);
    -webkit-font-smoothing:antialiased;
  }
  /* 细腻网格纹理 */
  body::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%);
    -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%);
  }
  /* 漂浮光斑 */
  .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;}
  .orb.a{width:420px;height:420px;background:#2f6fed;top:-120px;right:-80px;animation:float 14s ease-in-out infinite;}
  .orb.b{width:360px;height:360px;background:#1d4ed8;bottom:-140px;left:-90px;animation:float 18s ease-in-out infinite reverse;}
  @keyframes float{0%,100%{transform:translateY(0) translateX(0);}50%{transform:translateY(-30px) translateX(20px);}}

  .stage{
    position:relative;z-index:2;
    width:min(680px,92vw);
    text-align:center;
    padding:64px 48px;
    border-radius:28px;
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
    border:1px solid var(--line);
    box-shadow:0 40px 90px -40px rgba(2,12,35,.85),inset 0 1px 0 rgba(255,255,255,.18);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    animation:rise .8s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:none;}}

  .badge{
    display:inline-flex;align-items:center;gap:9px;
    font-size:12.5px;letter-spacing:.34em;font-weight:500;
    color:var(--blue-light);
    padding:7px 16px 7px 18px;
    border-radius:999px;
    border:1px solid rgba(96,165,250,.35);
    background:rgba(59,130,246,.12);
    margin-bottom:30px;
  }
  .badge .pulse{width:7px;height:7px;border-radius:50%;background:var(--blue-light);box-shadow:0 0 0 0 rgba(96,165,250,.6);animation:pulse 2.4s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(96,165,250,.55);}70%{box-shadow:0 0 0 9px rgba(96,165,250,0);}100%{box-shadow:0 0 0 0 rgba(96,165,250,0);}}

  h1{
    font-family:"Noto Serif SC",serif;
    font-size:clamp(30px,5.4vw,50px);
    font-weight:900;
    letter-spacing:.04em;
    line-height:1.25;
  }
  h1 .thin{display:block;font-family:"Noto Sans SC",sans-serif;font-weight:300;font-size:.42em;letter-spacing:.5em;color:var(--ink-soft);margin-bottom:14px;}
  .rule{width:54px;height:3px;border-radius:3px;margin:26px auto;background:linear-gradient(90deg,var(--blue-light),var(--blue));}
  .sub{font-size:14px;letter-spacing:.18em;color:var(--ink-soft);font-weight:300;}

  .enter{
    display:inline-flex;align-items:center;justify-content:center;gap:12px;
    margin-top:42px;
    min-width:240px;
    padding:18px 46px;
    font-size:16.5px;font-weight:600;letter-spacing:.22em;text-indent:.22em;
    color:#fff;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.25);
    background:linear-gradient(135deg,var(--blue-light) 0%,var(--blue) 45%,var(--blue-deep) 100%);
    box-shadow:0 18px 40px -14px rgba(37,99,235,.85),inset 0 1px 0 rgba(255,255,255,.35);
    cursor:pointer;
    transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s,filter .22s;
  }
  .enter:hover{transform:translateY(-3px);filter:brightness(1.06);box-shadow:0 26px 52px -16px rgba(37,99,235,.95),inset 0 1px 0 rgba(255,255,255,.4);}
  .enter:active{transform:translateY(-1px);}
  .enter svg{width:19px;height:19px;transition:transform .22s;}
  .enter:hover svg{transform:translateX(4px);}

  .foot{position:absolute;bottom:26px;left:0;right:0;z-index:2;text-align:center;font-size:12px;letter-spacing:.26em;color:rgba(174,196,230,.55);font-weight:300;}

  @media (max-width:560px){
    .stage{padding:52px 26px;border-radius:24px;}
    .enter{min-width:100%;padding:17px 30px;}
    .foot{bottom:18px;}
  }
  @media (prefers-reduced-motion:reduce){
    .orb,.badge .pulse{animation:none;}
    .stage{animation:none;}
  }
</style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>

  <main class="stage">
    <span class="badge"><span class="pulse"></span>2026</span>
    <h1><span class="thin">考务工作组</span>阅卷招募填报系统</h1>
    <div class="rule"></div>
    <p class="sub">在 线 填 报 · 实 时 汇 总</p>
    <a class="enter" href="https://4m17qvdw67qrf.doubao.link/app/app_17gy8pjddrx">
      进入系统
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </main>

  <div class="foot">2026 阅卷招募</div>
</body>
</html>
